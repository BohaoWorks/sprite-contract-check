[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-contract-check"
version = "0.1.0"
description = "Offline CI contracts for Aseprite JSON and PNG exports, independent of atlas packing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "zhengbohao74-lgtm"}]
dependencies = ["Pillow>=12.2.0,<13"]
keywords = ["aseprite", "sprite", "atlas", "pixel-art", "ci", "regression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/zhengbohao74-lgtm/sprite-contract-check"
Issues = "https://github.com/zhengbohao74-lgtm/sprite-contract-check/issues"

[project.scripts]
sprite-contract-check = "sprite_contract_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
